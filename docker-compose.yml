services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tinta-negra-api
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/database.sqlite3
    volumes:
      - sqlite_data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tinta-negra-web
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite_data:
